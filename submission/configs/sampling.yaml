# max_output_tokens was 16384 -- half the model's 32,768-token context reserved for
# a single output turn, leaving too little room for conversation history to grow
# across turns. Run 4 (eval_config.yaml removed as of the previous commit, so this
# was the only sampling-level cap left) crashed rich_3944 outright with
# litellm.ContextWindowExceededError once accumulated history + this reservation
# exceeded 32768 -- a hard crash that discards the task, not a graceful budget stop.
# Lowered to 8192, matching the value both actually-scoring public community
# submissions use.
temperature: 0.2
top_p: 0.95
max_output_tokens: 8192
thinking_config:
  thinking_budget: 4096
  include_thoughts: true
